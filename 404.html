<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Strona nie znaleziona · MR. ARTEMY FIT</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#080808;--gold:#C9A84C;--gold2:#E8C97A;--white:#F5F0E8;--gray:#888888;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:radial-gradient(circle at 85% 12%,rgba(201,168,76,.06),transparent 30%),
             radial-gradient(circle at 10% 80%,rgba(192,57,43,.04),transparent 26%),
             var(--black);
  color:var(--white);
  font-family:'Montserrat',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  overflow:hidden;
}
.wrap{max-width:520px;opacity:0;animation:fadeUp .8s cubic-bezier(.16,.84,.3,1) .1s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
.code{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(90px,22vw,170px);
  line-height:1;
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 0 60px rgba(201,168,76,.25);
}
.line{width:56px;height:1px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:18px auto 22px;}
h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(22px,4vw,30px);
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:14px;
}
p{
  color:var(--gray);
  font-size:14px;
  line-height:1.7;
  margin-bottom:34px;
}
.btn{
  display:inline-block;
  background:var(--gold);
  color:var(--black);
  padding:15px 36px;
  font-family:'Montserrat',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  text-decoration:none;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all .3s;
}
.btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 20px 40px rgba(201,168,76,.3);}
.logo{
  margin-top:44px;
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  letter-spacing:4px;
  color:rgba(245,240,232,.35);
}
.logo span{color:var(--gold);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="line"></div>
    <h1>Strona nie znaleziona</h1>
    <p>Ta strona nie istnieje albo została przeniesiona.<br>Wróć na stronę główną — wszystko inne działa jak należy.</p>
    <a href="/" class="btn">Strona główna →</a>
    <div class="logo"><span>MR.</span> ARTEMY FIT</div>
  </div>
</body>
</html>
